       - name: Build Kernel 2.6GHz
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # KernelSU ka fix
          git submodule update --init --recursive || true
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "Fixing missing KernelSU..."
            mkdir -p drivers/kernelsu
            echo "# dummy" > drivers/kernelsu/Kconfig
            sed -i '/kernelsu/d' drivers/Kconfig || true
          fi

          make surya_defconfig || make vendor/surya_defconfig
          make -j$(nproc) CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- Image.gz-dtb -k
          ls -lh arch/arm64/boot/
