name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fix slow Azure APT
        run: |
          # azure wala source hatao
          sudo sed -i '/azure/d' /etc/apt/sources.list
          sudo rm -rf /etc/apt/sources.list.d/*
          # ubuntu ke official source lagao
          echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu jammy-updates main universe" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update

      - name: Install deps
        run: |
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential clang lld llvm aarch64-linux-gnu-gcc

      - name: Build Kernel 2.6GHz
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Surya
          # defconfig dhundo
          ls arch/arm64/configs/ | grep -i surya
          make surya_defconfig
          make -j$(nproc) CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- Image.gz-dtb -k || true
          ls -lh arch/arm64/boot/

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Surya-2.6GHz-Image
          path: arch/arm64/boot/Image*
